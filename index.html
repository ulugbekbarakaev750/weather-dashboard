<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Темы Telegram */
        .tg-theme-dark { background-color: #212121; color: #ffffff; }
        .tg-theme-light { background-color: #ffffff; color: #000000; }
        .tg-theme-dark .card { background-color: #2c2c2e; border-color: #3a3a3c; }
        .tg-theme-light .card { background-color: #f2f2f7; border-color: #e5e5ea; }
        .tg-theme-dark .text-secondary { color: #8e8e93; }
        .tg-theme-light .text-secondary { color: #8e8e93; }

        /* Анимация иконок */
        .wi-animate { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        /* Спиннер загрузки */
        .loader { border: 4px solid rgba(128,128,128,0.2); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* ИСПРАВЛЕНИЕ СКРОЛЛА ДЛЯ ПРОГНОЗА */
        .scroll-x { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; /* Плавный скролл на iOS */
            scrollbar-width: none; /* Firefox */
        }
        .scroll-x::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
    </style>
</head>
<body class="min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto space-y-6">
        
        <!-- Поиск и GPS -->
        <div class="card rounded-2xl p-4 shadow-sm border">
            <div class="flex gap-2 mb-3">
                <input type="text" id="search-input" placeholder="Введите город..." 
                       class="w-full px-4 py-2 rounded-xl bg-black/5 dark:bg-white/10 border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="search-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-xl font-semibold transition-colors">🔍</button>
            </div>
            <button id="geo-btn" class="w-full py-2 rounded-xl bg-gray-200 dark:bg-gray-700 text-sm font-medium flex items-center justify-center gap-2 active:scale-95 transition-transform">
                📍 Моя геопозиция
            </button>
        </div>

        <!-- Алерты (Погодные предупреждения) -->
        <div id="alerts-container" class="hidden space-y-2">
            <!-- Сюда JS будет добавлять красные/желтые плашки -->
        </div>

        <!-- Главный экран -->
        <div id="loading-state" class="hidden text-center py-10">
            <div class="loader"></div>
            <p class="text-secondary text-sm">Загрузка данных...</p>
        </div>

        <div id="weather-content" class="space-y-6 hidden">
            <!-- Текущая погода -->
            <div class="card rounded-3xl p-6 shadow-sm border text-center relative overflow-hidden">
                <h2 id="city-name" class="text-2xl font-bold tracking-wide">Город</h2>
                <p id="weather-description" class="text-secondary capitalize text-sm mt-1">Описание</p>
                
                <div class="my-4 flex justify-center items-center">
                    <i id="weather-icon" class="wi wi-day-sunny text-7xl text-yellow-400 wi-animate"></i>
                </div>

                <div class="flex justify-center items-start">
                    <span id="current-temp" class="text-7xl font-extrabold tracking-tighter">0</span>
                    <span class="text-3xl font-bold mt-2">°C</span>
                </div>

                <!-- Доп параметры -->
                <div class="grid grid-cols-3 gap-3 pt-6 mt-4 border-t border-gray-300 dark:border-gray-600 text-xs">
                    <div class="flex flex-col items-center">
                        <i class="wi wi-strong-wind text-xl mb-1 text-secondary"></i>
                        <span id="wind-speed" class="font-bold">- м/с</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="wi wi-humidity text-xl mb-1 text-secondary"></i>
                        <span id="humidity" class="font-bold">- %</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="wi wi-barometer text-xl mb-1 text-secondary"></i>
                        <span id="pressure" class="font-bold">- гПа</span>
                    </div>
                </div>
            </div>

            <!-- НОВЫЕ БЛОКИ: Солнце и УФ-индекс -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Солнце -->
                <div class="card rounded-2xl p-4 shadow-sm border flex flex-col justify-between">
                    <h3 class="text-xs font-semibold text-secondary mb-2">☀️ Солнце</h3>
                    <div class="flex justify-between items-center text-sm">
                        <div class="flex flex-col items-center">
                            <i class="wi wi-sunrise text-orange-400 text-lg mb-1"></i>
                            <span id="sunrise" class="font-bold">--:--</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="wi wi-sunset text-red-400 text-lg mb-1"></i>
                            <span id="sunset" class="font-bold">--:--</span>
                        </div>
                    </div>
                </div>
                <!-- УФ-индекс -->
                <div class="card rounded-2xl p-4 shadow-sm border flex flex-col justify-between">
                    <h3 class="text-xs font-semibold text-secondary mb-2">🕶️ УФ-индекс</h3>
                    <div class="flex items-center justify-center gap-2">
                        <span id="uv-index" class="text-2xl font-extrabold text-purple-500">0</span>
                        <span id="uv-desc" class="text-xs font-medium text-secondary max-w-[60px] leading-tight">Низкий</span>
                    </div>
                </div>
            </div>

            <!-- График на 24 часа (ИСПРАВЛЕННЫЙ) -->
            <div class="card rounded-2xl p-4 shadow-sm border">
                <h3 class="text-sm font-semibold mb-3 text-secondary">📈 Температура (24ч)</h3>
                <div class="h-40 relative w-full">
                    <canvas id="weatherChart"></canvas>
                </div>
            </div>

            <!-- Прогноз на 5 дней (ИСПРАВЛЕННЫЙ СКРОЛЛ) -->
            <div class="card rounded-2xl p-4 shadow-sm border">
                <h3 class="text-sm font-semibold mb-3 text-secondary">📅 Прогноз на 5 дней</h3>
                <!-- Добавлен класс scroll-x и flex -->
                <div id="forecast-container" class="flex gap-3 scroll-x pb-2">
                    <!-- Карточки генерируются через JS -->
                </div>
            </div>
        </div>
        
        <!-- Приветствие -->
        <div id="welcome-state" class="text-center py-10">
            <i class="wi wi-cloudy text-6xl text-secondary mb-4"></i>
            <h2 id="greeting" class="text-xl font-bold">Привет!</h2>
            <p class="text-secondary mt-2">Введи город или нажми на геолокацию.</p>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
