<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <!-- Подключаем Tailwind CSS для красивой верстки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Динамические темы для заднего фона */
        .theme-sunny { background: linear-gradient(to bottom, #f7b733, #fc4a1a); }
        .theme-rainy { background: linear-gradient(to bottom, #3a7bd5, #3a6073); }
        .theme-cloudy { background: linear-gradient(to bottom, #606c88, #3f2b96); }
        
        body {
            transition: background 0.8s ease;
        }
        /* Стилизация скроллбара для панели логов */
        #log-container::-webkit-scrollbar {
            width: 4px;
        }
        #log-container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body id="body-bg" class="theme-cloudy min-h-screen text-white font-sans antialiased p-4">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- Заголовок и поиск -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-white/20">
            <h1 class="text-xl font-bold text-center mb-3 flex items-center justify-center gap-2">
                🌤️ Weather Analytics
            </h1>
            <div class="flex gap-2">
                <input type="text" id="search-input" placeholder="Введите город..." 
                       class="w-full px-4 py-2 rounded-xl bg-white/20 border border-white/10 placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-white">
                <button id="search-btn" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-all px-4 py-2 rounded-xl font-semibold">
                    Найти
                </button>
            </div>
        </div>

        <!-- Главный виджет погоды -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-6 shadow-lg border border-white/20 text-center relative overflow-hidden">
            <h2 id="city-name" class="text-3xl font-extrabold tracking-wide">Загрузка...</h2>
            <p id="weather-description" class="text-white/80 capitalize text-sm mt-1">Ожидание данных</p>
            
            <div class="my-6">
                <span id="current-temp" class="text-7xl font-light tracking-tighter">0</span><span class="text-4xl font-light">°C</span>
            </div>

            <!-- Дополнительные параметры -->
            <div class="grid grid-cols-3 gap-2 pt-4 border-t border-white/10 text-xs text-white/90">
                <div class="bg-white/5 rounded-xl p-2">
                    <p class="opacity-60 mb-1">💨 Ветер</p>
                    <p id="wind-speed" class="font-bold">- м/с</p>
                </div>
                <div class="bg-white/5 rounded-xl p-2">
                    <p class="opacity-60 mb-1">💧 Влажность</p>
                    <p id="humidity" class="font-bold">- %</p>
                </div>
                <div class="bg-white/5 rounded-xl p-2">
                    <p class="opacity-60 mb-1">🧭 Давление</p>
                    <p id="pressure" class="font-bold">- гПа</p>
                </div>
            </div>
        </div>

        <!-- Контейнер для графика (Chart.js) -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-white/20">
            <h3 class="text-sm font-semibold mb-2 opacity-80">📈 Суточный тренд температуры</h3>
            <div class="h-44 relative w-full">
                <canvas id="weatherChart"></canvas>
            </div>
        </div>

        <!-- Скрытая Админ-Панель (Разработчик / Мониторинг) -->
        <div class="bg-slate-900/80 backdrop-blur-md rounded-2xl p-4 shadow-xl border border-red-500/30">
            <div class="flex justify-between items-center border-b border-white/10 pb-2 mb-2">
                <h4 class="text-xs font-bold tracking-widest text-red-400 uppercase">🛠️ ДАШБОРД РАЗРАБОТЧИКА</h4>
                <span class="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded-full font-mono">STATUS: ACTIVE</span>
            </div>
            
            <!-- Метрики -->
            <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                <div class="bg-white/5 p-2 rounded-lg">
                    <p class="opacity-50 text-[10px]">Всего запросов</p>
                    <p id="total-requests" class="font-mono text-lg font-bold text-indigo-300">0</p>
                </div>
                <div class="bg-white/5 p-2 rounded-lg">
                    <p class="opacity-50 text-[10px]">Топ поиска</p>
                    <p id="top-city" class="font-mono text-sm font-bold text-emerald-300 truncate">-</p>
                </div>
            </div>

            <!-- Консоль логов системы -->
            <p class="text-[10px] uppercase tracking-wider opacity-40 mb-1 font-semibold">Логи сессии:</p>
            <div id="log-container" class="bg-black/40 rounded-xl p-2 h-20 overflow-y-auto text-[10px] font-mono text-green-400 space-y-0.5">
                <div><span class="opacity-50">[Система]</span> Дашборд успешно запущен.</div>
            </div>
        </div>

    </div>

    <!-- Подключаем логику скрипта -->
    <script src="app.js"></script>
</body>
</html>
