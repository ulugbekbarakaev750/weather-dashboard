<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background 1s ease, color 0.3s; /* Плавная смена фона за 1 секунду */
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
        }
        
        /* Эффект матового стекла для карточек */
        .card { 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tg-theme-light .card { background-color: rgba(255, 255, 255, 0.65); border-color: rgba(0,0,0,0.05); }
        .tg-theme-dark .card { background-color: rgba(30, 30, 30, 0.65); border-color: rgba(255,255,255,0.08); }
        
        .text-secondary { color: rgba(255, 255, 255, 0.75); }

        /* 🎨 ДИНАМИЧЕСКИЕ ТЕМЫ ПОГОДЫ (Градиенты) */
        
        /* Ясный День */
        .weather-clear-day { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        
        /* Ясная Ночь */
        .weather-clear-night { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); color: white; }
        
        /* Облачно (День) */
        .weather-cloudy-day { background: linear-gradient(135deg, #606c88 0%, #3f4c6b 100%); color: white; }
        
        /* Облачно (Ночь) */
        .weather-cloudy-night { background: linear-gradient(135deg, #232526 0%, #414345 100%); color: white; }
        
        /* Дождь */
        .weather-rain { background: linear-gradient(135deg, #3a7bd5 0%, #3a6073 100%); color: white; }
        
        /* Гроза */
        .weather-storm { background: linear-gradient(135deg, #141E30 0%, #243B55 100%); color: white; }
        
        /* Снег */
        .weather-snow { background: linear-gradient(135deg, #83a4d4 0%, #b6fbff 100%); color: #333; }
        .weather-snow .text-secondary { color: rgba(0,0,0,0.6); }
        .weather-snow .card { background-color: rgba(255, 255, 255, 0.8); border-color: rgba(255,255,255,0.5); }
        
        /* Туман */
        .weather-fog { background: linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%); color: white; }

        /* Анимации */
        .wi-animate { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        
        .loader { border: 4px solid rgba(255,255,255,0.3); border-left-color: #ffffff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .scroll-x::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 pb-20">
    <div class="max-w-md mx-auto space-y-6">
        
        <!-- Поиск и GPS -->
        <div class="card rounded-2xl p-4 shadow-sm">
            <div class="flex gap-2 mb-3">
                <input type="text" id="search-input" placeholder="..." class="w-full px-4 py-2 rounded-xl bg-black/10 dark:bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-white/50 text-inherit placeholder-opacity-70">
                <button id="search-btn" class="bg-white/20 hover:bg-white/30 active:scale-95 text-inherit px-4 py-2 rounded-xl font-semibold transition-all">🔍</button>
            </div>
            <button id="geo-btn" class="w-full py-2 rounded-xl bg-black/10 dark:bg-white/10 hover:bg-black/20 dark:hover:bg-white/20 text-sm font-medium flex items-center justify-center gap-2 active:scale-95 transition-all">
                📍 <span id="txt-geo">Моя геопозиция</span>
            </button>
        </div>

        <div id="alerts-container" class="hidden space-y-2"></div>

        <div id="loading-state" class="hidden text-center py-10">
            <div class="loader"></div>
            <p id="txt-loading" class="text-secondary text-sm">Загрузка...</p>
        </div>

        <div id="weather-content" class="space-y-6 hidden">
            <div class="card rounded-3xl p-6 shadow-sm text-center relative overflow-hidden">
                <h2 id="city-name" class="text-2xl font-bold tracking-wide">Город</h2>
                <p id="weather-description" class="text-secondary capitalize text-sm mt-1">Описание</p>
                <div class="my-4 flex justify-center items-center">
                    <i id="weather-icon" class="wi wi-day-sunny text-7xl text-yellow-300 drop-shadow-lg wi-animate"></i>
                </div>
                <div class="flex justify-center items-start">
                    <span id="current-temp" class="text-7xl font-extrabold tracking-tighter drop-shadow-md">0</span>
                    <span class="text-3xl font-bold mt-2">°C</span>
                </div>
                <div class="grid grid-cols-3 gap-3 pt-6 mt-4 border-t border-white/20 text-xs">
                    <div class="flex flex-col items-center">
                        <i class="wi wi-strong-wind text-xl mb-1 text-secondary"></i>
                        <span id="wind-speed" class="font-bold">-</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="wi wi-humidity text-xl mb-1 text-secondary"></i>
                        <span id="humidity" class="font-bold">-</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="wi wi-barometer text-xl mb-1 text-secondary"></i>
                        <span id="pressure" class="font-bold">-</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="card rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                    <h3 id="txt-sun" class="text-xs font-semibold text-secondary mb-2">☀️ Солнце</h3>
                    <div class="flex justify-between items-center text-sm">
                        <div class="flex flex-col items-center">
                            <i class="wi wi-sunrise text-orange-300 text-lg mb-1"></i>
                            <span id="sunrise" class="font-bold">--:--</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="wi wi-sunset text-red-300 text-lg mb-1"></i>
                            <span id="sunset" class="font-bold">--:--</span>
                        </div>
                    </div>
                </div>
                <div class="card rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                    <h3 id="txt-uv-title" class="text-xs font-semibold text-secondary mb-2">🕶️ УФ-индекс</h3>
                    <div class="flex items-center justify-center gap-2">
                        <span id="uv-index" class="text-2xl font-extrabold text-purple-300 drop-shadow">0</span>
                        <span id="uv-desc" class="text-xs font-medium text-secondary max-w-[60px] leading-tight">Низкий</span>
                    </div>
                </div>
            </div>

            <div class="card rounded-2xl p-4 shadow-sm">
                <h3 id="txt-chart" class="text-sm font-semibold mb-3 text-secondary">📈 Температура (24ч)</h3>
                <div class="h-40 relative w-full"><canvas id="weatherChart"></canvas></div>
            </div>

            <div class="card rounded-2xl p-4 shadow-sm">
                <h3 id="txt-forecast" class="text-sm font-semibold mb-3 text-secondary">📅 Прогноз на 5 дней</h3>
                <div id="forecast-container" class="flex gap-3 scroll-x pb-2"></div>
            </div>
        </div>
        
        <div id="welcome-state" class="text-center py-10">
            <i class="wi wi-cloudy text-6xl text-secondary mb-4"></i>
            <h2 id="greeting" class="text-xl font-bold drop-shadow">Привет!</h2>
            <p id="txt-welcome-desc" class="text-secondary mt-2">Введи город или нажми на геолокацию.</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
